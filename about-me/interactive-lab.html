
<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивные элементы</title>
    <script src="js/interactive.js" defer></script>
  </head>
  <body>
    <style>
    body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 30px auto;
        padding: 15px;
      }
      
      section {
        padding: 15px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      
      button {
        padding: 8px 12px;
        margin: 5px;
        cursor: pointer;
      }
      
      .completed {
        text-decoration: line-through;
        color: gray;
      }
      
      .answer {
        display: none;
        padding: 10px;
        background: #edf5ff;
      }
      
      .answer.open {
        display: block;
      }
      </style>
      
    <h1>Практика JavaScript</h1>

    <section>
      <h2>1. Создание элементов</h2>
      <div id="container"></div>
    </section>

    <section>
      <h2>2. Список дел</h2>
      <input id="task-input" type="text" placeholder="Новая задача">
      <button id="add-task">Добавить</button>
      <ul id="task-list"></ul>
    </section>

    <section>
      <h2>3. Вопросы и ответы</h2>
      <button class="question">Что такое HTML?</button>
      <p class="answer">Язык разметки веб-страниц.</p>
      <button class="question">Что такое CSS?</button>
      <p class="answer">Язык оформления веб-страниц.</p>
      <button class="question">Что такое JavaScript?</button>
      <p class="answer">Язык программирования.</p>
      <button class="question">Что такое DOM?</button>
      <p class="answer">это модель документа для работы с HTML</p>
    </section>

    <section>
      <h2>4. Слайдер изображений</h2>
      <img id="slider-image" src="" alt="Изображение" width="400">
      <p id="slide-number"></p>
      <button id="prev-slide">Назад</button>
      <button id="next-slide">Вперёд</button>
    </section>
  </body>
</html>
